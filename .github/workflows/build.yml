name: Build Ngate VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Ngate-VST3-Windows
          path: build/Ngate_artefacts/Release/VST3/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign (ad-hoc) and zip
        run: |
          codesign --force --deep -s - build/Ngate_artefacts/Release/VST3/Ngate.vst3
          cd build/Ngate_artefacts/Release/VST3
          ditto -c -k --keepParent Ngate.vst3 Ngate-VST3-macOS.zip

      - name: Upload VST3 (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: Ngate-VST3-macOS
          path: build/Ngate_artefacts/Release/VST3/Ngate-VST3-macOS.zip
